name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Şriftlər (axtarışlı PDF testi üçün)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation
      - name: Asılılıqları quraşdır
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Testlər
        working-directory: backend
        run: python -m pytest -q
